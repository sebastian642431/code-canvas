name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p code-canvas
      - name: Package
        shell: pwsh
        run: |
          $name = "code-canvas-windows-x64"
          New-Item -ItemType Directory -Force $name | Out-Null
          Copy-Item target/release/code-canvas.exe, README.md, README.es.md, LICENSE-MIT, LICENSE-APACHE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip" -Force
          Copy-Item target/release/code-canvas.exe code-canvas.exe
      - uses: actions/upload-artifact@v4
        with:
          name: code-canvas-windows-x64
          path: |
            code-canvas-windows-x64.zip
            code-canvas.exe
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            code-canvas-windows-x64.zip
            code-canvas.exe
          generate_release_notes: true
