[workspace]
resolver = "2"
members = ["crates/canvas-core", "crates/canvas-render", "crates/canvas-relay", "crates/code-canvas"]

[workspace.package]
version = "0.4.7"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sebastian642431/code-canvas"
rust-version = "1.94"

[workspace.dependencies]
canvas-core = { path = "crates/canvas-core" }
canvas-render = { path = "crates/canvas-render" }
canvas-relay = { path = "crates/canvas-relay" }
glyphon = "0.12"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
ignore = "0.4"
rayon = "1"
rfd = "0.18"
wgpu = "30"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"
ureq = "3"
notify = "8"
arboard = "3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
trash = "5"
resvg = { version = "0.50", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
wry = "0.57"
portable-pty = "0.9"
vt100 = "0.18"
zip = { version = "2", default-features = false, features = ["deflate"] }
similar = "2"
ring = "0.17"
flate2 = "1"
irosashi = { version = "0.3.1", default-features = false }

[profile.dev.package."*"]
opt-level = 2
