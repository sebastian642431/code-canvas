[workspace]
resolver = "2"
members = ["crates/canvas-core", "crates/canvas-render", "crates/code-canvas"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sebastian642431/code-canvas"
rust-version = "1.85"

[workspace.dependencies]
canvas-core = { path = "crates/canvas-core" }
canvas-render = { path = "crates/canvas-render" }
glyphon = "0.12"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
ignore = "0.4"
rayon = "1"
rfd = "0.18"
wgpu = "30"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ureq = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
wry = "0.57"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev.package."*"]
opt-level = 2
